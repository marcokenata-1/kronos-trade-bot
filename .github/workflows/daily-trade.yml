name: Daily Trade

on:
  schedule:
    - cron: '0 22 * * *'  # 08:00 AEST (UTC+10) — adjust if AEDT/DST matters to you
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ALPACA_PAPER_API_KEY: ${{ secrets.ALPACA_PAPER_API_KEY }}
  ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Kronos model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos

      - run: pip install -r requirements.txt

      - run: python bot.py auto
      - run: python bot.py auto --crypto --notional 10
      - run: python bot.py rebalance

      - name: Persist baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.json
          git diff --cached --quiet || git commit -m "Update baseline"
          git push
